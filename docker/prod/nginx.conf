log_format sierra_access escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"response_bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream sierra_auth_php {
    zone sierra_auth_php 64k;
    server sierra_auth_app:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 32m;

    access_log /dev/stdout sierra_access;
    error_log /dev/stderr warn;

    location ~* ^/(?:\.env(?:\..*)?|\.git(?:/|$)|\.svn(?:/|$)|\.hg(?:/|$)|_environment$|_profiler(?:/|$)|(?:[^/]+/)*(?:wp-admin|wp-content|wp-includes)(?:/|$)|wp-login\.php$|wp-config\.php(?:\.(?:bak|old|save)|~)?$|xmlrpc\.php$|vendor/phpunit(?:/|$)|phpunit(?:/|$)|cgi-bin(?:/|$)|(?:[^/]+/)*(?:phpinfo|info)(?:\.php)?(?:\.(?:bak|old|save)|~)?$|(?:[^/]+/)*(?:application_default_credentials|credentials|firebase-adminsdk|firebase-key|gcp-credentials|gcp-key|gcp-sa|google-credentials|google-key|key|keyfile|sa|secrets|service-account|config)\.(?:json|ya?ml)$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        internal;
        if ($request_uri ~ "^/index\\.php(?:\\?|$)") { return 404; }
        include fastcgi_params;
        fastcgi_pass sierra_auth_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
